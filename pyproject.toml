[project]
name = "eamo"
version = "0.1.0"
description = "Construction recipe vs. mitigation effectiveness in eval-awareness model organisms"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=4.51",  # Qwen3 support
    "accelerate",
    "datasets",
    "peft",
    "pyyaml",
    "numpy",
    "openai",              # OpenRouter-compatible client
    "matplotlib",
]

[project.optional-dependencies]
gpu = ["vllm"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = ["slow: end-to-end script runs (minutes)"]
